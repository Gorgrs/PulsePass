spring:

  application:
    name: pulsepass

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pulsepass}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:

    open-in-view: false

    hibernate:
      # Flyway es el unico responsable del esquema (restriccion tecnica del PRD).
      # validate = Hibernate compara el mapeo contra las tablas existentes y falla
      # si no coinciden; nunca crea ni modifica nada.
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
